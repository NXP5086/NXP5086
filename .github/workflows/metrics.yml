# ============================================================================
#  Metrics — generates github-metrics.svg and commits it to this repo.
#  Because the image is a committed file (not a live service), it never
#  rate-limits or breaks the way the old stat cards did.
#
#  WHERE THIS GOES:  .github/workflows/metrics.yml   (in your NXP5086 repo)
#
#  ONE-TIME SETUP (see the chat message for the click-by-click version):
#    1. Create a GitHub Personal Access Token (classic). Scopes: repo, read:org.
#    2. Repo → Settings → Secrets and variables → Actions → New repository secret
#       Name it exactly:  METRICS_TOKEN   (paste the token as the value)
#    3. Commit this file, then run it once: Actions tab → Metrics → Run workflow.
#       It will commit github-metrics.svg, and your README image will appear.
# ============================================================================

name: Metrics

on:
  # Rebuild once a day (~1 AM Central)
  schedule: [{cron: "0 6 * * *"}]
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Also rebuild when you push to the default branch
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Personal access token stored as the repo secret METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}

          # ---- Layout: rich but tidy ----
          base: header, community, repositories
          config_timezone: America/Chicago

          # Language breakdown across your repos
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Isometric (3D) contribution calendar — full year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits — most active days/times, with facts + charts
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lines of code changed
          plugin_lines: yes